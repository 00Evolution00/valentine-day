<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наша история ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Наша история</h1>
    <div class="counter">
        <div class="counter-item">
            <span id="days"></span>
            <span class="counter-label">дней</span>
        </div>
        <div class="counter-item">
            <span id="hours"></span>
            <span class="counter-label">часов</span>
        </div>
        <div class="counter-item">
            <span id="minutes"></span>
            <span class="counter-label">минут</span>
        </div>
    </div>

<p class="counter-text">Мы вместе уже ❤️</p>

        <section class="timeline">
            <div class="event">
                <h2>28 октября 2022</h2>
                <p>Начало отношений</p>
                <img src="assets/img/first_date.png" alt="И тогда же первая прогулка.">
            </div>
            
            <div class="event">
                <h2>Первые слова любви</h2>
                <img src="assets/img/vacation.png" alt="">
            </div>
        </section>
        
        <div class="message">
            <p>С любовью, Сашенька ❤️</p>
        </div>
    </div>
    
    <audio controls autoplay loop>
        <source src="assets/audio/song.mp3" type="audio/mpeg">
    </audio>
    <script src="script.js"></script>
</body>
</html>
